<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light dark" />
<title>System32 Emulator: Cockpit</title>
<script>
  // ?embed=1: only the Controller and the switches, for an iframe in a guide page.
  if (new URLSearchParams(location.search).get("embed") === "1") document.documentElement.classList.add("embed");
</script>
<style>
  :root {
    --bg: #f3f2ee;
    --ink: #1c1c1e;
    --ink-2: #3f3f44;
    --muted: #707076;
    --line: #dddbd4;
    --field: #ffffff;
    --accent: #1d5bc7;
    --accent-ink: #ffffff;
    --shadow: rgba(30, 28, 20, 0.22);
    /* The hardware looks the same in both themes. */
    --hw-engrave: #d4d4cf;
    --hw-engrave-2: #9b9b97;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111214;
      --ink: #ececea;
      --ink-2: #c9c9c5;
      --muted: #909096;
      --line: #2a2b30;
      --field: #1b1c1f;
      --accent: #84abff;
      --accent-ink: #0d1424;
      --shadow: rgba(0, 0, 0, 0.6);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1140px; margin: 0 auto; padding: 0 32px; }

  a { color: var(--accent); }
  button { font: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* Header */
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 22px 0 16px; }
  .brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .brand-name { font-weight: 650; font-size: 16px; letter-spacing: 0.01em; }
  .brand-view { color: var(--muted); font-size: 15px; }
  .nff {
    font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; white-space: nowrap;
  }

  /* Scenario bar */
  .scn {
    display: grid;
    grid-template-columns: 230px minmax(0, 1fr) auto;
    gap: 28px;
    align-items: start;
    padding: 20px 0 22px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .eyebrow {
    display: block; margin: 0 0 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--muted);
  }
  select {
    width: 100%; font: inherit; font-size: 15px; color: var(--ink); background: var(--field);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
  }
  .scn-note { display: block; margin-top: 8px; font-size: 13px; color: var(--muted); min-height: 1.2em; }
  .step-n { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .step-say { margin: 0; font-size: 21px; line-height: 1.3; font-weight: 600; letter-spacing: -0.005em; }
  .step-watch { margin: 8px 0 0; color: var(--ink-2); font-size: 15px; max-width: 62ch; }
  .step-watch:empty { display: none; }
  .step-ctl { display: flex; gap: 8px; align-items: center; padding-top: 20px; flex-wrap: wrap; justify-content: flex-end; }
  .btn {
    border: 1px solid var(--line); background: var(--field); color: var(--ink); border-radius: 8px;
    padding: 8px 16px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn[disabled] { opacity: 0.45; cursor: default; }
  .btn[hidden] { display: none; }
  @media (max-width: 900px) {
    .scn { grid-template-columns: 1fr; gap: 14px; }
    .step-ctl { padding-top: 0; justify-content: flex-start; }
  }

  /* Cockpit: the Controller on the left, the switches on the right */
  .cockpit {
    display: grid;
    grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr);
    gap: 56px;
    align-items: start;
    padding: 40px 0 36px;
  }
  @media (max-width: 900px) { .cockpit { grid-template-columns: minmax(0, 1fr); gap: 28px; padding-top: 24px; } }

  /* The Cockpit Controller: a square face for a 3 1/8 in instrument hole. Every control is placed from FACE (script). */
  .cc-col { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .cc {
    position: relative;
    width: 100%;
    max-width: 540px;
    aspect-ratio: 330 / 371;
    filter: drop-shadow(0 22px 28px var(--shadow)) drop-shadow(0 2px 3px rgba(0, 0, 0, 0.25));
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  .cc-face { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .cc-screen { position: absolute; background: #000; overflow: hidden; }
  .cc-screen canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
  .cc-glass {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(150deg, rgba(255, 255, 255, 0.07) 0%, rgba(255, 255, 255, 0.015) 38%, transparent 39%);
  }
  .cc-over {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column;
    gap: 12px; background: rgba(8, 8, 10, 0.78); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
    color: #f1f1ee; font-size: 16px; font-weight: 600; text-align: center; padding: 16px;
  }
  .cc-over[hidden] { display: none; }
  .cc-over .btn.primary { font-size: 16px; padding: 10px 26px; }
  .cc-screen { border-radius: 1.6%; }
  .cc-btn {
    position: absolute;
    border-radius: 50%;
    border: 1px solid #050505;
    background:
      radial-gradient(circle at 36% 30%, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0) 38%),
      radial-gradient(circle at 50% 50%, #2c2d31 0%, #1b1c1f 62%, #0f1012 100%);
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.18), inset 0 -2px 3px rgba(0, 0, 0, 0.6), 0 2px 3px rgba(0, 0, 0, 0.7);
    cursor: pointer;
    padding: 0;
    touch-action: none;
  }
  .cc-btn:hover { filter: brightness(1.15); }
  .cc-btn.down {
    transform: scale(0.95);
    box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.8), 0 1px 1px rgba(0, 0, 0, 0.6);
  }
  .cc-knob { position: absolute; border-radius: 50%; touch-action: none; filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.6)); }
  .cc-knurl {
    position: absolute; inset: 0; cursor: grab;
    background:
      repeating-conic-gradient(from 0deg, rgba(255, 255, 255, 0.035) 0deg 20deg, rgba(0, 0, 0, 0.1) 20deg 40deg),
      radial-gradient(circle at 50% 50%, #303135 0%, #26272a 60%, #161719 100%);
  }
  .cc-knurl:active { cursor: grabbing; }
  .cc-shine {
    position: absolute; inset: 10%; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle at 34% 28%, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0) 55%);
  }
  .cc-push {
    position: absolute; left: 26%; top: 26%; width: 48%; height: 48%; border-radius: 50%; padding: 0; cursor: pointer;
    border: 1px solid rgba(0, 0, 0, 0.35);
    background: radial-gradient(circle at 40% 35%, #36373b 0%, #27282b 60%, #1f2023 100%);
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.08);
  }
  .cc-push.down { transform: scale(0.95); background: radial-gradient(circle at 40% 36%, #2f3034 0%, #1c1d20 60%, #121315 100%); }
  .chord { font-size: 12px; letter-spacing: 0.06em; padding: 5px 12px; color: var(--muted); }

  /* The switch panel */
  .side { display: flex; flex-direction: column; gap: 26px; min-width: 0; }
  .plate {
    position: relative;
    border-radius: 14px;
    padding: 26px 26px 22px;
    color: var(--hw-engrave);
    background:
      radial-gradient(circle at 13px 13px, #4b4c51 0 3px, #0d0d0e 3.5px, transparent 4px),
      radial-gradient(circle at calc(100% - 13px) 13px, #4b4c51 0 3px, #0d0d0e 3.5px, transparent 4px),
      radial-gradient(circle at 13px calc(100% - 13px), #4b4c51 0 3px, #0d0d0e 3.5px, transparent 4px),
      radial-gradient(circle at calc(100% - 13px) calc(100% - 13px), #4b4c51 0 3px, #0d0d0e 3.5px, transparent 4px),
      linear-gradient(180deg, #27282b 0%, #1e1f22 100%);
    border: 1px solid #0c0c0d;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 14px 26px var(--shadow);
    user-select: none;
    -webkit-user-select: none;
  }
  .engr { font-size: 10.5px; font-weight: 650; letter-spacing: 0.12em; text-transform: uppercase; color: var(--hw-engrave); }
  .sw-groups { display: flex; justify-content: space-between; gap: 10px; --tog-w: 52px; --tog-h: 85px; }
  .plate { container-type: inline-size; }
  .grp .engr { white-space: nowrap; }
  .grp { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; }
  .grp-body { display: flex; align-items: flex-start; gap: 2px; }
  .legend {
    position: relative; height: var(--tog-h); width: 26px;
    font-size: 9.5px; font-weight: 650; letter-spacing: 0.08em; text-transform: uppercase; color: var(--hw-engrave-2);
  }
  .legend span { position: absolute; right: 2px; transform: translateY(-50%); }
  .legend span:first-child { top: 13%; }
  .legend span:last-child { top: 87%; }
  .tog {
    display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; padding: 0;
    width: var(--tog-w); cursor: pointer; color: var(--hw-engrave); border-radius: 8px;
  }
  .tog svg { width: var(--tog-w); height: var(--tog-h); display: block; overflow: visible; }
  .tog .lever { transform-box: view-box; transform-origin: 22px 36px; transition: transform 0.12s ease-out; }
  .tog[aria-checked="false"] .lever, .tog[data-value="2"] .lever { transform: scaleY(-1); }
  .tog-n { font-size: 12px; font-weight: 650; }
  /* The power quadrant: throttle (black knob) and prop (blue knob), forward = up */
  .pow {
    display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 24px; align-items: start;
    margin-top: 24px; padding-top: 22px; border-top: 1px solid rgba(255, 255, 255, 0.07);
    --lev-h: 156px; --slot-w: 46px; --knob-h: 24px;
  }
  .quad {
    display: flex; gap: 34px; padding: 14px 22px 12px; border-radius: 10px; background: #18191b;
    box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.6), 0 1px 0 rgba(255, 255, 255, 0.05);
  }
  .lev { display: grid; grid-template-rows: var(--lev-h) auto; column-gap: 4px; row-gap: 10px; }
  .lev { grid-template-columns: var(--slot-w); justify-items: center; }
  .lev-name { grid-row: 2; text-align: center; white-space: nowrap; }
  .lev-slot { position: relative; height: var(--lev-h); width: var(--slot-w); cursor: ns-resize; touch-action: none; border-radius: 8px; }
  .lev-slot::before {
    content: ""; position: absolute; left: 50%; top: 4px; bottom: 4px; width: 10px; margin-left: -5px; border-radius: 5px;
    background: #0a0b0c; box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.95), 0 1px 0 rgba(255, 255, 255, 0.07);
  }
  .lev-knob {
    position: absolute; left: 0; width: 100%; height: var(--knob-h); border-radius: calc(var(--knob-h) / 2);
    top: calc((1 - var(--v, 0)) * (var(--lev-h) - var(--knob-h)));
    border: 1px solid #000; box-shadow: 0 3px 6px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.18);
    background: radial-gradient(ellipse at 40% 25%, #6a6b70 0%, #2a2b2f 45%, #121315 100%);
  }
  .lev.prop .lev-knob {
    background:
      repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.13) 0 2px, transparent 2px 5px),
      linear-gradient(180deg, #4b7fe6 0%, #2353b8 55%, #173c88 100%);
  }
  .lev-slot:focus-visible { outline-offset: 2px; }
  .eng { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .ro-label { font-size: 10px; font-weight: 650; letter-spacing: 0.1em; text-transform: uppercase; color: var(--hw-engrave-2); }
  .ro-val { font-size: 30px; line-height: 1.1; font-weight: 500; color: #f4f4f0; font-variant-numeric: tabular-nums; }
  .ro-val small { font-size: 12px; color: var(--hw-engrave-2); margin-left: 4px; font-weight: 500; }
  @media (max-width: 420px) { .plate { padding: 24px 16px 20px; } }
  /* A narrow panel (a phone, or the embed beside the Controller): smaller switches. */
  @container (max-width: 340px) {
    .sw-groups { --tog-w: 40px; --tog-h: 66px; gap: 6px; }
    .legend { width: 20px; font-size: 9px; }
    .grp .engr { font-size: 9.5px; letter-spacing: 0.08em; }
    .pow { --slot-w: 42px; --lev-h: 140px; gap: 14px; }
    .quad { gap: 30px; padding: 12px 18px 10px; }
    .lev-name { font-size: 9.5px; letter-spacing: 0.08em; }
    .ro-val { font-size: 24px; }
  }
  /* Narrower still (the embed beside the Controller): the engine readouts under the levers. */
  @container (max-width: 290px) {
    .pow { grid-template-columns: minmax(0, 1fr); justify-items: center; }
    .eng { flex-direction: row; flex-wrap: wrap; justify-content: space-between; width: 100%; gap: 10px 16px; }
  }


  /* The bench, folded */
  .bench { border-top: 1px solid var(--line); padding: 16px 0; }
  .bench summary { cursor: pointer; font-weight: 600; color: var(--ink-2); }
  .bench p { margin: 10px 0 6px; color: var(--ink-2); max-width: 70ch; }
  .bench-set { display: flex; flex-wrap: wrap; gap: 12px 24px; margin: 12px 0 14px; }
  .bench-set label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  .bench-set select { width: auto; max-width: 100%; font-size: 14px; padding: 6px 8px; }
  .notice { padding: 16px 0 36px; font-size: 12px; color: var(--muted); }
  .notice p { margin: 0 0 4px; }

  /* A phone */
  @media (max-width: 560px) {
    .wrap { padding: 0 16px; }
    .top { padding: 14px 0 10px; }
    .scn { padding: 14px 0 16px; gap: 10px; }
    .scn .eyebrow[for] { display: none; }
    .scn-note { margin-top: 4px; }
    .scn-note:empty { display: none; }
    .step-say { font-size: 18px; }
    .step-watch { font-size: 14px; margin-top: 4px; }
    .btn { padding: 7px 14px; }
  }

  /* ?embed=1 */
  html.embed body { background: transparent; }
  html.embed .top, html.embed .scn, html.embed .bench { display: none; }
  html.embed .wrap { padding: 0 12px; }
  html.embed .cockpit { padding: 12px 0 8px; gap: 24px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: center; }
  @media (max-width: 680px) { html.embed .cockpit { grid-template-columns: minmax(0, 1fr); } }
  html.embed .notice { padding: 0 0 10px; font-size: 11px; text-align: center; }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="brand-name">System32 Emulator</span>
      <span class="brand-view">Cockpit</span>
    </div>
    <span class="nff">Not for flight</span>
  </header>

  <section class="scn" aria-label="Scenario">
    <div>
      <label class="eyebrow" for="scn-pick">Scenario</label>
      <select id="scn-pick"></select>
      <span class="scn-note" id="scn-note" role="status"></span>
    </div>
    <div aria-live="polite">
      <div class="step-n" id="step-n">&nbsp;</div>
      <p class="step-say" id="step-say">Loading…</p>
      <p class="step-watch" id="step-watch"></p>
    </div>
    <div class="step-ctl">
      <button type="button" class="btn" id="step-act" hidden></button>
      <button type="button" class="btn primary" id="scn-start" hidden>Start</button>
      <button type="button" class="btn primary" id="step-next" hidden>Next</button>
      <button type="button" class="btn" id="scn-restart" disabled>Restart</button>
    </div>
  </section>

  <main class="cockpit">
    <div class="cc-col">
      <div class="cc" id="cc" aria-label="Cockpit Controller">
        <svg class="cc-face" id="cc-face" aria-hidden="true"></svg>
        <div class="cc-screen" id="cc-screen">
          <canvas id="lcd" width="320" height="240" aria-label="Controller screen"></canvas>
          <div class="cc-glass"></div>
          <div class="cc-over" id="cc-over" hidden>
            <span id="cc-over-text"></span>
            <button type="button" class="btn primary" id="cc-start" hidden>Start</button>
          </div>
        </div>
      </div>
      <button type="button" class="btn chord" id="cc-chord" title="Press TUNE and MONITOR together">TUNE + MONITOR</button>
    </div>

    <div class="side">
      <div class="plate" id="switches">
        <div class="sw-groups">
          <div class="grp">
            <span class="engr">Ignition</span>
            <div class="grp-body">
              <div class="legend" aria-hidden="true"><span>On</span><span>Off</span></div>
              <button type="button" class="tog" id="sw-ign1" role="switch" aria-label="Ignition 1" data-ctl="sw-e1-pld"></button>
              <button type="button" class="tog" id="sw-ign2" role="switch" aria-label="Ignition 2" data-ctl="sw-e2-pld"></button>
            </div>
          </div>
          <div class="grp">
            <span class="engr">Fuel Pump</span>
            <div class="grp-body">
              <div class="legend" aria-hidden="true"><span>1</span><span>2</span></div>
              <button type="button" class="tog" id="sw-pump" aria-label="Fuel Pump" data-value="1"></button>
            </div>
          </div>
          <div class="grp">
            <span class="engr">ECU Select</span>
            <div class="grp-body">
              <div class="legend" aria-hidden="true"><span>1</span><span>2</span></div>
              <button type="button" class="tog" id="sw-select" aria-label="ECU Select" data-value="1"></button>
            </div>
          </div>
        </div>

        <div class="pow">
          <div class="quad">
            <div class="lev throttle">
              <div class="lev-slot" id="throttle" role="slider" tabindex="0" aria-label="Throttle" aria-valuemin="0"
                   aria-valuemax="100" aria-valuenow="0"><span class="lev-knob"></span></div>
              <span class="engr lev-name">Throttle</span>
            </div>
            <div class="lev prop">
              <div class="lev-slot" id="prop" role="slider" tabindex="0" aria-label="Prop" aria-valuemin="0"
                   aria-valuemax="100" aria-valuenow="100"><span class="lev-knob"></span></div>
              <span class="engr lev-name">Prop</span>
            </div>
          </div>
          <div class="eng">
            <div><div class="ro-label">RPM</div><div class="ro-val" id="ro-rpm">0</div></div>
            <div><div class="ro-label">MAP</div><div class="ro-val"><span id="ro-map">29.9</span><small>inHg</small></div></div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <details class="bench" id="bench">
    <summary>Bench</summary>
    <div class="bench-set">
      <label>Low-pitch stop
        <select id="set-prop-stop">
          <option value="correct">Correct</option>
          <option value="fine">Too fine</option>
        </select></label>
    </div>
    <a id="bench-link" href="index.html">Open the bench</a>
  </details>

  <footer class="notice">
    <p><span id="fw-label"></span>Not affiliated with, endorsed by, or sponsored by Protek Performance / FlyEFII.</p>
  </footer>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="g-nut" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9dadc" /><stop offset="0.5" stop-color="#8c8e92" /><stop offset="1" stop-color="#4a4c50" />
    </linearGradient>
    <radialGradient id="g-bush" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#9a9ca0" /><stop offset="1" stop-color="#2a2b2e" />
    </radialGradient>
    <linearGradient id="g-bat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7b7d82" /><stop offset="0.45" stop-color="#f1f2f3" /><stop offset="1" stop-color="#6d6f74" />
    </linearGradient>
    <radialGradient id="g-tip" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffffff" /><stop offset="0.6" stop-color="#b9bbbf" /><stop offset="1" stop-color="#6a6c70" />
    </radialGradient>
  </defs>
</svg>

<script src="s32_wasm.js"></script>
<script src="s32_bench.js"></script>
<script>
"use strict";
/* The cockpit view: the Cockpit Controller as the instrument, the panel switches, one throttle, and each scenario's
 * steps for the pilot (SCENARIOS in s32_bench.js). It drives the same bench as index.html, with the same controls and
 * defaults (BENCH_DEFAULTS), through the same scenario runner. */

const QUERY = new URLSearchParams(location.search);
const EMBED = QUERY.get("embed") === "1";
const $ = (id) => document.getElementById(id);

/* The Controller's face, drawn from a photo of the real unit, in units of 1/330 of the face's width (the face is a
 * little taller than wide). x / y are the centers of the round controls; the screen, card slot and indicator are
 * placed by their top left corner. The buttons are the real ones, labeled below: MENU, TUNE and MONITOR, each driving
 * the same Controller input as the bench page's button of that name (n: 1, 2, 3; the knob's push is 0). The firmware's
 * own soft labels (Up, Down, Back, Push to Select) appear only on the screen. To adjust the drawing, change these. */
const FACE = {
  w: 330,
  h: 371,
  corner: 7,
  screen: { x: 23, y: 35, w: 284, h: 213, corner: 10, inset: 0.035 },
  knob: { x: 57, y: 318, d: 82, flutes: 9 },
  buttons: [
    { n: 1, label: "MENU", x: 139, y: 324, d: 38 },
    { n: 2, label: "TUNE", x: 204, y: 324, d: 38 },
    { n: 3, label: "MONITOR", x: 269, y: 324, d: 38 },
  ],
  buttonLabelY: 364,
  buttonLabelSize: 12.5,
  slot: { x: 123, y: 282, w: 101, h: 13 },
  indicator: { x: 268, y: 284, d: 8 },
  knobDegPerClick: 18,
};

/* The engine: a simple bench model of an engine with a constant-speed propeller, made up for this page (not aircraft
 * data). It sets the bench's RPM, MAP and throttle sensor from the two levers and from the sparks the ECUs fire.
 *   power      the RPM the engine reaches with the blades on a correctly set low-pitch stop, both ECUs firing,
 *              against the throttle (0..1); a stop set elsewhere scales the part above idle (stops: the RPM at full
 *              throttle on the stop)
 *   governor   the prop lever (0..1) sets the governed RPM, low to high. When the engine could turn faster, the
 *              governor coarsens the blades until it holds that RPM; the blade angle follows with a first-order lag
 *              (tau.governor), so a fast throttle push overshoots first; while no ECU fires the blades stay where they
 *              are. Below that, the blades sit on the stop and the throttle sets the RPM.
 *   oneEcu     the share of power with only one ECU firing; with none the engine winds down and stops below stopBelow
 *   closedMap  MAP with the throttle closed, against RPM (ambient when stopped); opening: the share of the way from
 *              there to fullMap, against the throttle. So MAP rises with throttle and falls a little as RPM rises.
 *   tau        how fast RPM follows: up, down, winding down with no spark; and the governor's lag (seconds)
 *   startHold  after a scenario starts the engine, RPM is held this long while the ECUs pick up the crank signal
 * An ECU counts as firing while its first coil fires at least half as often as the RPM calls for (once per
 * revolution), measured over the last `window` seconds. Mixture, fuel and temperatures do not change the RPM. */
const ENGINE = {
  power: [[0, 750], [0.25, 1800], [0.5, 2520], [0.65, 2620], [1, 2700]],
  stops: { correct: 2700, fine: 3150 },
  governor: [2000, 2700],
  oneEcu: 0.85,
  closedMap: [[0, 29.9], [750, 12.0], [2700, 10.0]],
  opening: [[0, 0], [0.25, 0.45], [0.5, 0.7], [0.65, 0.8], [1, 1]],
  fullMap: 29.0,
  tau: { up: 0.4, down: 0.6, nospark: 1.5, governor: 0.8 },
  stopBelow: 200,
  startHold: 1.0,
  window: 0.3,
};

let M = null;
let booted = false;
let simSpeed = 0;
let lastFrameWall = performance.now();
let frameCounter = 0;
const lcd = s32CreateLcd($("lcd"));

function renderLcdFrame(rgbaPtr) {
  lcd.draw(M, rgbaPtr);
}

function telemetry() {
  return s32Telemetry(M);
}

/* ---- The bench: the bench page's controls by id, at its defaults ---- */

const bench = { ...BENCH_DEFAULTS };
let cylinders = 4;                    // the default firmware's configuration
const TRIGGER_DEG = [80, 77];         // the trigger sensor positions, as on the bench page

function applyEngine() {
  if (!M) return;
  M._s32_wasm_set_cylinders(cylinders, TRIGGER_DEG[0], TRIGGER_DEG[1]);
  M._s32_wasm_set_rpm(bench["sl-rpm"]);
}

function applySensors() {
  if (!M) return;
  M._s32_wasm_set_sensors(bench["sl-map"], bench["sl-tps"], bench["sl-iat"], bench["sl-et"], bench["sl-batt1"],
                          bench["sl-batt2"], bench["sl-noise"], -1.0);
}

function applyEcu(k) {
  if (!M) return;
  const p = k === 0 ? "sw-e1-" : "sw-e2-";
  M._s32_wasm_set_switches(k, bench[p + "pld"] ? 1 : 0, bench[p + "inj"] ? 1 : 0, bench[p + "ret"] ? 1 : 0,
                           bench[p + "pwr"] ? 1 : 0);
  M._s32_wasm_set_link(k, bench[p + "lnk"] ? 1 : 0);
}

function applyTpsFault() {
  if (!M) return;
  const mode = bench["sel-e2-tps"];
  if (mode === "float") M._s32_wasm_set_tps_fault(1, 512, 30);
  else if (mode === "gnd") M._s32_wasm_set_tps_fault(1, 0, 0);
  else if (mode === "5v") M._s32_wasm_set_tps_fault(1, 1023, 0);
  else { M._s32_wasm_set_tps_fault(1, -1, 0); applySensors(); }
}

function applyMapFault() {
  if (!M || !booted) return;
  const mode = bench["sel-e1-map"];
  M.ccall("s32_wasm_set_an_fault", "number", ["number", "number", "string"], [0, 5, mode === "none" ? "" : mode]);
}

function applyPumps() {
  if (!M || !booted) return;
  const t = (telemetry().time_s + 0.001).toFixed(4);
  const pos = (id) => (bench[id] ? "on" : "off");
  s32SetKnob(M, "S32_SWITCH", `${t}:pump1=${pos("sw-pump1")},${t}:pump2=${pos("sw-pump2")}`);
}

function reboot() {
  if (!M) return;
  booted = M._s32_wasm_boot(cylinders, TRIGGER_DEG[0], TRIGGER_DEG[1]) === 0;
  if (booted) {
    applyEngine();
    applySensors();
    applyEcu(0);
    applyEcu(1);
    applyTpsFault();
    applyMapFault();
    applyPumps();
  }
}

// One bench control by its id on the bench page, then what that control drives.
function setControl(id, value) {
  if (id === "sel-ecu-select") {      // the switch grounds the Fuel Injectors Enable wire of the ECU not selected
    bench["sw-e1-inj"] = value === "1" || value === "both";
    bench["sw-e2-inj"] = value === "2" || value === "both";
    applyEcu(0);
    applyEcu(1);
  } else if (id === "prop-stop") {     // the propeller's low-pitch stop (a bench setting)
    eng.stop = value;
  } else if (id === "sel-pump") {      // the pump switch runs one pump: 1 or 2
    bench["sw-pump1"] = value === "1";
    bench["sw-pump2"] = value === "2";
    applyPumps();
  } else if (!(id in BENCH_DEFAULTS)) {
    throw new Error(`no control ${id} on the cockpit page`);
  } else {
    bench[id] = typeof BENCH_DEFAULTS[id] === "number" ? Number(value) : value;
    if (id === "sl-rpm") applyEngine();
    else if (id.startsWith("sl-")) applySensors();
    else if (id.startsWith("sw-e1-")) applyEcu(0);
    else if (id.startsWith("sw-e2-")) applyEcu(1);
    else if (id === "sel-e1-map") applyMapFault();
    else if (id === "sel-e2-tps") applyTpsFault();
    else applyPumps();
  }
  showControls();
}

/* ---- The engine model (ENGINE) ---- */

const eng = { throttle: 0, prop: 1, stop: "correct", pitch: 0, rpm: 0, hold: -1, firing: [false, false],
              hist: [], last: null };

function interp(table, x) {
  if (x <= table[0][0]) return table[0][1];
  for (let i = 1; i < table.length; i++) {
    const [x0, y0] = table[i - 1], [x1, y1] = table[i];
    if (x <= x1) return y0 + (x - x0) / (x1 - x0) * (y1 - y0);
  }
  return table[table.length - 1][1];
}

function powerRpm(throttle) {
  const idle = ENGINE.power[0][1];
  return idle + (interp(ENGINE.power, throttle) - idle) * (ENGINE.stops[eng.stop] - idle) / (ENGINE.stops.correct - idle);
}

const governedRpm = (prop) => ENGINE.governor[0] + prop * (ENGINE.governor[1] - ENGINE.governor[0]);

function manifold(throttle, rpm) {
  const closed = interp(ENGINE.closedMap, rpm);
  return closed + (ENGINE.fullMap - closed) * interp(ENGINE.opening, throttle);
}

// The blade angle (0 = on the low-pitch stop) the governor wants: the one that turns the engine at the governed RPM
// with this share of its power. And the RPM the engine settles at with the blades there.
function engineFree(share) {
  return share > 0 ? powerRpm(eng.throttle) * Math.cbrt(share) : 0;
}

function governorPitch(free) {
  const gov = governedRpm(eng.prop);
  return free > gov ? 1 - gov / free : 0;
}

function engineTarget(share) {
  const free = engineFree(share);
  return free * (1 - governorPitch(free));
}

// The throttle (0..1) that gives this MAP at this RPM.
function throttleFor(map, rpm) {
  let lo = 0, hi = 1;
  for (let i = 0; i < 40; i++) {
    const mid = (lo + hi) / 2;
    if (manifold(mid, rpm) < map) lo = mid; else hi = mid;
  }
  return (lo + hi) / 2;
}

const propFor = (rpm) => (rpm - ENGINE.governor[0]) / (ENGINE.governor[1] - ENGINE.governor[0]);

// The bench's RPM, MAP and throttle sensor from the model.
function engineOut() {
  const rpm = Math.round(eng.rpm), map = Math.round(manifold(eng.throttle, eng.rpm) * 100) / 100;
  const tps = Math.round(eng.throttle * 1000) / 10;
  if (rpm !== bench["sl-rpm"]) { bench["sl-rpm"] = rpm; applyEngine(); }
  if (map !== bench["sl-map"] || tps !== bench["sl-tps"]) { bench["sl-map"] = map; bench["sl-tps"] = tps; applySensors(); }
}

function engineStop() {
  eng.rpm = 0;
  eng.hold = -1;
  eng.firing = [false, false];
  eng.hist = [];
  engineOut();
}

// Set the levers and the propeller's bench settings to a scenario's quadrant and start the engine at the speed they
// give with both ECUs firing.
function engineQuadrant(q) {
  if (!q) return;
  eng.stop = q.stop || "correct";
  eng.prop = q.rpm !== undefined ? propFor(q.rpm) : (q.prop ?? 100) / 100;
  eng.throttle = q.map !== undefined ? throttleFor(q.map, governedRpm(eng.prop)) : (q.throttle ?? 0) / 100;
  eng.pitch = governorPitch(engineFree(1));
  eng.rpm = engineTarget(1);
  eng.hold = M && booted ? telemetry().time_s + ENGINE.startHold : -1;
  eng.firing = [true, true];
  eng.hist = [];
  engineOut();
  showControls();
}

// One step of the model, from the bench's telemetry after the bench ran.
function engineUpdate(t) {
  const now = t.time_s, sp = t.ecu.map((e) => e.coils[0].sparks);
  if (eng.last === null || now < eng.last || (eng.hist.length && sp.some((v, k) => v < eng.hist[eng.hist.length - 1][1][k]))) {
    eng.last = now;                    // a power cycle: time and spark counts start again
    eng.hist = [[now, sp]];
    return;
  }
  const dt = now - eng.last;
  if (dt <= 0) return;
  eng.last = now;
  eng.hist.push([now, sp]);
  while (eng.hist.length > 2 && now - eng.hist[1][0] >= ENGINE.window) eng.hist.shift();
  const [t0, s0] = eng.hist[0], span = now - t0;
  if (eng.rpm <= 0) eng.firing = [false, false];
  else if (span >= ENGINE.window / 2) {
    for (const k of [0, 1]) eng.firing[k] = (sp[k] - s0[k]) / (eng.rpm / 60 * span) >= 0.5;
  }
  if (eng.rpm <= 0 || now < eng.hold) return;
  const n = eng.firing.filter(Boolean).length;
  const share = n === 2 ? 1 : n === 1 ? ENGINE.oneEcu : 0;
  const free = engineFree(share);
  if (share > 0) eng.pitch += (governorPitch(free) - eng.pitch) * Math.min(1, dt / ENGINE.tau.governor);
  const target = free * (1 - eng.pitch);
  const tau = share === 0 ? ENGINE.tau.nospark : target > eng.rpm ? ENGINE.tau.up : ENGINE.tau.down;
  eng.rpm += (target - eng.rpm) * Math.min(1, dt / tau);
  if (share === 0 && eng.rpm < ENGINE.stopBelow) eng.rpm = 0;
  engineOut();
}

// Run the bench, the engine model with it (0.05 s steps).
function stepSim(quanta) {
  for (let left = quanta; left > 0;) {
    const n = Math.min(500, left);
    M._s32_wasm_step_quanta(n);
    left -= n;
    if (booted) engineUpdate(telemetry());
  }
}

// Run the bench for secs of emulated time, then draw (for a test, or a page that embeds this one).
function runBench(secs) {
  stepSim(Math.round(secs * 10000));
  refresh();
  renderLcdFrame(M._s32_wasm_render_rgba());
}

function setLever(which, pct) {
  eng[which] = Math.min(100, Math.max(0, pct)) / 100;
  if (eng.rpm > 0) engineOut();
  showControls();
}

/* ---- What the page shows of the bench ---- */

const ecuSelect = () => (bench["sw-e2-inj"] && !bench["sw-e1-inj"] ? "2" : "1");

function showControls() {
  for (const el of document.querySelectorAll(".tog[role=switch]")) el.setAttribute("aria-checked", String(!!bench[el.dataset.ctl]));
  const sel = $("sw-select");
  sel.dataset.value = ecuSelect();
  sel.setAttribute("aria-label", `ECU Select: ${ecuSelect()}`);
  for (const which of ["throttle", "prop"]) {
    const el = $(which), v = Math.round(eng[which] * 1000) / 10;
    el.style.setProperty("--v", eng[which]);
    el.setAttribute("aria-valuenow", String(v));
  }
  $("ro-map").textContent = Number(bench["sl-map"]).toFixed(1);
  $("set-prop-stop").value = eng.stop;
  $("sw-pump").dataset.value = bench["sw-pump2"] && !bench["sw-pump1"] ? "2" : "1";
  $("sw-pump").setAttribute("aria-label", `Fuel Pump: ${$("sw-pump").dataset.value}`);
}

// The engine readouts.
function showReadouts(t) {
  $("ro-rpm").textContent = String(Math.round(t.rpm));
}

function refresh() {
  if (M && booted) showReadouts(telemetry());
}

/* ---- The Controller ---- */

const SVGNS = "http://www.w3.org/2000/svg";
function svgEl(name, attrs, parent) {
  const el = document.createElementNS(SVGNS, name);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, String(v));
  if (parent) parent.append(el);
  return el;
}

function place(el, x, y, w, h) {
  Object.assign(el.style, { left: `${(x - w / 2) / FACE.w * 100}%`, top: `${(y - h / 2) / FACE.h * 100}%`,
                            width: `${w / FACE.w * 100}%`, height: `${h / FACE.h * 100}%` });
}

function buildFace() {
  const { w: W, h: H } = FACE, svg = $("cc-face");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  $("cc").style.aspectRatio = `${W} / ${H}`;
  const defs = svgEl("defs", {}, svg);
  const grad = (id, stops, attrs = { x1: 0, y1: 0, x2: 0, y2: 1 }, kind = "linearGradient") => {
    const g = svgEl(kind, { id, ...attrs }, defs);
    stops.forEach(([o, c]) => svgEl("stop", { offset: o, "stop-color": c }, g));
  };
  grad("g-face", [[0, "#26272a"], [0.5, "#1c1d1f"], [1, "#161719"]]);
  grad("g-led", [[0, "#f2f2ef"], [0.6, "#a9aaa8"], [1, "#5e5f60"]], { cx: 0.4, cy: 0.35, r: 0.7 }, "radialGradient");
  svgEl("rect", { x: 0.75, y: 0.75, width: W - 1.5, height: H - 1.5, rx: FACE.corner, fill: "url(#g-face)",
                  stroke: "#0a0a0b", "stroke-width": 1.5 }, svg);
  svgEl("rect", { x: 2.5, y: 2.5, width: W - 5, height: H - 5, rx: FACE.corner - 1.5, fill: "none",
                  stroke: "rgba(255,255,255,0.07)", "stroke-width": 1 }, svg);
  // The screen's glass: rounded corners and a thin bright rim.
  const sc = FACE.screen;
  svgEl("rect", { x: sc.x, y: sc.y, width: sc.w, height: sc.h, rx: sc.corner, fill: "#050506",
                  stroke: "rgba(225,228,232,0.55)", "stroke-width": 0.9 }, svg);
  // The card slot above MENU and TUNE, and the indicator above MONITOR (drawing only).
  const sl = FACE.slot;
  svgEl("rect", { x: sl.x, y: sl.y, width: sl.w, height: sl.h, rx: 2.5, fill: "#2b2c2f", stroke: "#0b0b0c",
                  "stroke-width": 0.8 }, svg);
  svgEl("rect", { x: sl.x + 3, y: sl.y + sl.h / 2 - 1.8, width: sl.w - 6, height: 3.6, rx: 1.5, fill: "#030303" }, svg);
  svgEl("line", { x1: sl.x + 3, y1: sl.y + 1.2, x2: sl.x + sl.w - 3, y2: sl.y + 1.2, stroke: "rgba(255,255,255,0.12)",
                  "stroke-width": 0.6 }, svg);
  const led = FACE.indicator;
  svgEl("circle", { cx: led.x, cy: led.y, r: led.d / 2, fill: "url(#g-led)", stroke: "#111", "stroke-width": 0.6 }, svg);
  for (const b of FACE.buttons) {
    svgEl("circle", { cx: b.x, cy: b.y, r: b.d / 2 + 2.2, fill: "#101112", stroke: "rgba(255,255,255,0.06)",
                      "stroke-width": 0.6 }, svg);
    const t = svgEl("text", { x: b.x, y: FACE.buttonLabelY, "text-anchor": "middle", fill: "#f1f1ee",
                              "font-size": FACE.buttonLabelSize, "font-weight": 700, "letter-spacing": 0.3,
                              "font-family": "system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" }, svg);
    t.textContent = b.label;
  }
  const inset = sc.inset;
  place($("cc-screen"), sc.x + sc.w / 2, sc.y + sc.h / 2, sc.w * (1 - 2 * inset), sc.h * (1 - 2 * inset));
}

function buildControls() {
  const cc = $("cc");
  for (const b of FACE.buttons) {
    const el = document.createElement("button");
    el.type = "button";
    el.className = "cc-btn";
    el.id = "cc-btn-" + b.n;
    el.setAttribute("aria-label", b.label);
    place(el, b.x, b.y, b.d, b.d);
    holdable(el, b.n);
    cc.append(el);
  }
  const k = FACE.knob;
  const knob = document.createElement("div");
  knob.className = "cc-knob";
  knob.id = "cc-knob";
  knob.tabIndex = 0;
  knob.setAttribute("role", "group");
  knob.setAttribute("aria-label", "Knob");
  place(knob, k.x, k.y, k.d, k.d);
  knob.innerHTML = '<div class="cc-knurl" id="cc-knurl"></div><div class="cc-shine"></div>' +
                   '<button type="button" class="cc-push" id="cc-push" tabindex="-1" aria-label="Knob push"></button>';
  // The fluted edge: a wavy outline with k.flutes lobes.
  const pts = [];
  for (let i = 0; i < 180; i++) {
    const a = i / 180 * 2 * Math.PI, r = 50 * (0.93 + 0.07 * Math.cos(k.flutes * a));
    pts.push(`${(50 + r * Math.cos(a)).toFixed(2)}% ${(50 + r * Math.sin(a)).toFixed(2)}%`);
  }
  knob.querySelector(".cc-knurl").style.clipPath = `polygon(${pts.join(", ")})`;
  cc.append(knob);
  holdable($("cc-push"), 0);
  turnable(knob, $("cc-knurl"));
}

// The page is a bench: any control starts it when it waits (paused), none acts while a scenario is being set up.
function interact() {
  if (!M || !booted || scenarios.busy()) return false;
  if (simSpeed === 0) setSpeed(1);
  return true;
}

// A Controller button (0 = the knob's push): down while the pointer or key is down, so a tap and a hold both work.
function holdable(el, n) {
  const up = () => {
    if (!el.classList.contains("down")) return;
    el.classList.remove("down");
    M._s32_wasm_button(n, 0);
  };
  const down = () => {
    if (el.classList.contains("down") || !interact()) return false;
    el.classList.add("down");
    M._s32_wasm_button(n, 1);
    return true;
  };
  el.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    e.stopPropagation();
    if (down()) el.setPointerCapture(e.pointerId);
  });
  el.addEventListener("pointerup", up);
  el.addEventListener("pointercancel", up);
  el.addEventListener("lostpointercapture", up);
  el.addEventListener("keydown", (e) => {
    if ((e.key === " " || e.key === "Enter") && !e.repeat) { e.preventDefault(); down(); }
  });
  el.addEventListener("keyup", (e) => {
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); up(); }
  });
  el.addEventListener("contextmenu", (e) => e.preventDefault());
}

let knobAngle = 0;
function turnKnob(steps) {
  if (!steps || !interact()) return;
  M._s32_wasm_encoder_turn(steps);
  knobAngle += steps * FACE.knobDegPerClick;
  $("cc-knurl").style.transform = `rotate(${knobAngle}deg)`;
}

// The knob turns by dragging around it, the mouse wheel, the arrow keys, or a click on its left or right half.
function turnable(knob, knurl) {
  let drag = null;
  const angleAt = (e) => {
    const r = knob.getBoundingClientRect();
    return Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2)) * 180 / Math.PI;
  };
  knurl.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    knob.focus({ preventScroll: true });
    drag = { id: e.pointerId, a: angleAt(e), acc: 0, x: e.clientX, y: e.clientY, moved: false };
    knurl.setPointerCapture(e.pointerId);
  });
  knurl.addEventListener("pointermove", (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 5) drag.moved = true;
    const a = angleAt(e);
    let d = a - drag.a;
    if (d > 180) d -= 360;
    if (d < -180) d += 360;
    drag.a = a;
    drag.acc += d;
    while (Math.abs(drag.acc) >= FACE.knobDegPerClick) {
      const dir = drag.acc > 0 ? 1 : -1;
      drag.acc -= dir * FACE.knobDegPerClick;
      turnKnob(dir);
    }
  });
  const end = (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    if (!drag.moved && e.type === "pointerup") {
      const r = knob.getBoundingClientRect();
      turnKnob(e.clientX < r.left + r.width / 2 ? -1 : 1);
    }
    drag = null;
  };
  knurl.addEventListener("pointerup", end);
  knurl.addEventListener("pointercancel", end);
  let wheel = 0;
  knob.addEventListener("wheel", (e) => {
    e.preventDefault();
    wheel += e.deltaMode === 1 ? e.deltaY * 40 : e.deltaY;
    while (Math.abs(wheel) >= 40) {
      const dir = wheel < 0 ? 1 : -1;
      wheel += dir * 40;
      turnKnob(dir);
    }
  }, { passive: false });
  let pushing = false;
  knob.addEventListener("keydown", (e) => {
    if (e.target !== knob) return;
    if (e.key === "ArrowRight" || e.key === "ArrowUp") { e.preventDefault(); turnKnob(1); }
    else if (e.key === "ArrowLeft" || e.key === "ArrowDown") { e.preventDefault(); turnKnob(-1); }
    else if ((e.key === "Enter" || e.key === " ") && !e.repeat && !pushing && interact()) {
      e.preventDefault();
      pushing = true;
      $("cc-push").classList.add("down");
      M._s32_wasm_button(0, 1);
    }
  });
  knob.addEventListener("keyup", (e) => {
    if ((e.key === "Enter" || e.key === " ") && pushing) {
      pushing = false;
      $("cc-push").classList.remove("down");
      M._s32_wasm_button(0, 0);
    }
  });
}

/* ---- The switch panel ---- */

const TOGGLE_SVG = '<svg viewBox="0 0 44 72" aria-hidden="true">' +
  '<circle cx="22" cy="36" r="15.5" fill="#141517" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>' +
  '<polygon points="33,36 27.5,45.53 16.5,45.53 11,36 16.5,26.47 27.5,26.47" fill="url(#g-nut)" stroke="#0b0b0c" stroke-width="0.8"/>' +
  '<circle cx="22" cy="36" r="6.2" fill="url(#g-bush)" stroke="#0b0b0c" stroke-width="0.6"/>' +
  '<g class="lever"><path d="M19.8 36 L17.6 10 Q22 6.2 26.4 10 L24.2 36 Z" fill="url(#g-bat)" stroke="#3a3b3f" stroke-width="0.5"/>' +
  '<ellipse cx="22" cy="9.6" rx="4.9" ry="3.6" fill="url(#g-tip)" stroke="#4a4b4f" stroke-width="0.5"/></g></svg>';

function buildSwitches() {
  for (const el of document.querySelectorAll(".tog")) {
    const two = el.dataset.value !== undefined;      // a two-position switch: ECU Select, Fuel Pump
    el.innerHTML = TOGGLE_SVG + (two ? "" : `<span class="tog-n">${el.id.slice(-1)}</span>`);
    el.addEventListener("click", () => {
      if (!interact()) return;
      const other = el.dataset.value === "1" ? "2" : "1";
      if (el.id === "sw-select") setControl("sel-ecu-select", other);
      else if (el.id === "sw-pump") setControl("sel-pump", other);
      else setControl(el.dataset.ctl, !bench[el.dataset.ctl]);
    });
  }
  // The levers: drag (forward = up) or the arrow keys.
  for (const which of ["throttle", "prop"]) {
    const slot = $(which), knob = slot.querySelector(".lev-knob");
    const valueAt = (y) => {
      const r = slot.getBoundingClientRect(), h = knob.offsetHeight;
      return 100 * (1 - (y - r.top - h / 2) / (r.height - h));
    };
    let dragging = null;
    slot.addEventListener("pointerdown", (e) => {
      if (e.button !== 0 || !interact()) return;
      e.preventDefault();
      slot.focus({ preventScroll: true });
      const r = knob.getBoundingClientRect();
      const onKnob = e.clientY >= r.top && e.clientY <= r.bottom;
      dragging = { id: e.pointerId, offset: onKnob ? e.clientY - (r.top + r.height / 2) : 0 };
      slot.setPointerCapture(e.pointerId);
      setLever(which, valueAt(e.clientY - dragging.offset));
    });
    slot.addEventListener("pointermove", (e) => {
      if (dragging && e.pointerId === dragging.id) setLever(which, valueAt(e.clientY - dragging.offset));
    });
    const end = () => { dragging = null; };
    slot.addEventListener("pointerup", end);
    slot.addEventListener("pointercancel", end);
    slot.addEventListener("keydown", (e) => {
      const step = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1, PageUp: 10, PageDown: -10 }[e.key];
      const to = e.key === "Home" ? 0 : e.key === "End" ? 100 : null;
      if (step === undefined && to === null) return;
      e.preventDefault();
      if (!interact()) return;
      setLever(which, to !== null ? to : eng[which] * 100 + step);
    });
  }
  $("set-prop-stop").addEventListener("change", () => {
    if (M && booted && !scenarios.busy()) setControl("prop-stop", $("set-prop-stop").value);
    else showControls();
  });
  $("cc-chord").addEventListener("click", () => { if (interact()) M._s32_wasm_button_pulse(0b1100, 1500); });
}

/* ---- Scenarios and the steps for the pilot ---- */

let current = null;     // the scenario on show
let stepIdx = 0;

function setSpeed(s) {
  simSpeed = s;
  lastFrameWall = performance.now();
  showState();
}

// The screen overlay and the Start buttons: setting up, waiting to start, or running.
function showState() {
  const busy = scenarios.busy();
  const waiting = !busy && booted && simSpeed === 0 && window.S32_SCENARIO && window.S32_SCENARIO.state === "done";
  $("cc-over").hidden = !(busy || waiting);
  $("cc-over-text").textContent = busy ? "Setting up…" : waiting ? (current ? current.title : "") : "";
  $("cc-start").hidden = !waiting;
  $("scn-start").hidden = !waiting;
  $("step-next").hidden = waiting || busy || !current || stepIdx >= (current.pilot || []).length;
  $("step-act").disabled = busy;
  $("scn-restart").disabled = busy || !current;
  if (noteKind === "paused" && simSpeed > 0) note("");
}

let noteKind = "";
function note(text, kind = "") {
  noteKind = kind;
  $("scn-note").textContent = text;
}

function showScenario() {
  const pick = $("scn-pick");
  pick.value = current ? current.id : "";
  $("bench-link").href = "index.html" + (current ? "?scenario=" + encodeURIComponent(current.id) : "");
  showStep();
}

function showStep() {
  const steps = (current && current.pilot) || [];
  const act = $("step-act");
  if (!current) {
    $("step-n").textContent = " ";
    $("step-say").textContent = "Pick a scenario";
    $("step-watch").textContent = "";
    act.hidden = true;
  } else if (stepIdx < steps.length) {
    const st = steps[stepIdx];
    $("step-n").textContent = `${current.title} · ${stepIdx + 1}/${steps.length}`;
    $("step-say").textContent = st.say;
    $("step-watch").textContent = st.watch;
    act.hidden = !st.act;
    act.textContent = st.act || "";
    $("step-next").textContent = stepIdx === steps.length - 1 ? "Finish" : "Next";
  } else {
    $("step-n").textContent = current.title;
    $("step-say").textContent = "Done";
    $("step-watch").textContent = "";
    act.hidden = true;
  }
  showState();
}

const NOTES = {
  unknown: (sc) => `No scenario "${sc.id}".`,
  "no-firmware": () => "No firmware.",
  setup: () => "Setting up…",
  paused: () => "",
  running: () => "",
  error: (sc, e) => `${sc.title}: ${e && e.message}`,
};

const scenarios = s32ScenarioRunner({
  M: () => M,
  booted: () => booted,
  reboot,
  stepSim,
  draw: () => renderLcdFrame(M._s32_wasm_render_rgba()),
  refresh,
  resetControls(blank) {
    Object.assign(bench, BENCH_DEFAULTS);
    Object.assign(eng, { throttle: 0, prop: 1, stop: "correct", pitch: 0 });
    engineStop();                        // the panel powers up with the engine stopped
    if (blank) cylinders = 4;            // the stock firmware's default configuration
    showControls();
  },
  // The engine steps of a scenario set the levers to its quadrant; the engine model does the rest.
  actions: {
    preset: () => engineQuadrant(current.quadrant),
    rpm: () => engineQuadrant(current.quadrant),
    set: (id, value) => (["sl-rpm", "sl-map", "sl-tps"].includes(id) ? engineQuadrant(current.quadrant) : setControl(id, value)),
  },
  setSpeed,
  note(kind, sc, err) {
    note(NOTES[kind](sc, err), kind);
    showState();
  },
  started(sc) {
    current = sc;
    stepIdx = 0;
    showScenario();
  },
  finished() {
    showStep();
  },
});

async function runScenario(id, keepRunning) {
  const run = scenarios.run(id, keepRunning);
  showState();
  await run;
  showState();
}

function pickScenario(id) {
  const u = new URL(location.href);
  u.searchParams.set("scenario", id);
  u.searchParams.delete("autostart");
  history.replaceState(null, "", u);
  runScenario(id, true);
}

function buildScenarioBar() {
  const pick = $("scn-pick");
  const none = document.createElement("option");
  none.value = "";
  none.textContent = "Scenario";
  none.disabled = true;
  pick.append(none);
  for (const sc of SCENARIOS) {
    const o = document.createElement("option");
    o.value = sc.id;
    o.textContent = sc.title;
    pick.append(o);
  }
  pick.value = "";
  pick.addEventListener("change", () => pickScenario(pick.value));
  $("step-next").addEventListener("click", () => {
    stepIdx++;
    showStep();
  });
  $("step-act").addEventListener("click", async () => {
    const st = current && current.pilot && current.pilot[stepIdx];
    if (!st || !st.do || !interact()) return;
    const run = scenarios.act(st.do);
    showState();
    await run;
    showState();
  });
  $("scn-restart").addEventListener("click", () => { if (current) runScenario(current.id, true); });
  for (const id of ["scn-start", "cc-start"]) $(id).addEventListener("click", () => { if (booted) setSpeed(1); });
}

/* ---- The run loop and start-up ---- */

function tick() {
  const now = performance.now();
  const dtMs = Math.min(50, Math.max(1, now - lastFrameWall));
  lastFrameWall = now;
  if (M && booted && simSpeed > 0 && !scenarios.busy()) {
    stepSim(Math.round(dtMs * 10));
    renderLcdFrame(M._s32_wasm_render_rgba());
    if (++frameCounter % 6 === 0) refresh();
  }
  requestAnimationFrame(tick);
}

// The default firmware (firmware/manifest.json, each file checked against its SHA-256), then its first power-up on
// blank configuration chips (2 s: the firmware writes its default settings) and one power cycle, as on the bench page.
async function loadDefaultFirmware() {
  const fw = await s32FetchDefaultFirmware();
  if (!fw) return false;
  for (const f of fw.files) s32LoadFile(M, f.name, new Uint8Array(await f.arrayBuffer()));
  $("fw-label").textContent = `Firmware: ${fw.label}. `;
  reboot();
  if (!booted) return false;
  if (M._s32_wasm_step_quanta(20000) === 0) reboot();
  if (booted) engineStop();
  return booted;
}

buildFace();
buildControls();
buildSwitches();
buildScenarioBar();
showControls();
showScenario();
$("step-say").textContent = "Loading…";

createS32Module().then(async (mod) => {
  M = mod;
  requestAnimationFrame(tick);
  const id = QUERY.get("scenario");
  let ok = false;
  try {
    ok = await loadDefaultFirmware();
  } catch (e) {
    note("Default firmware refused: " + e.message + ".");
    window.S32_SCENARIO = { id, state: "no-firmware" };
    return;
  }
  if (!ok) {
    note(NOTES["no-firmware"]());
    $("step-say").textContent = "No firmware";
    window.S32_SCENARIO = { id, state: "no-firmware" };
    return;
  }
  if (!M._s32_wasm_have_ct()) $("cc-over-text").textContent = "No Controller image";
  if (id !== null) {
    await runScenario(id, QUERY.get("autostart") === "1");
    if (window.S32_SCENARIO.state === "unknown") {
      setSpeed(1);
      showScenario();
    }
  } else {
    await runScenario("runup", true);   // no scenario named: start at the run-up
  }
});
</script>
</body>
